<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Hira 浏览器 - 开源项目致谢</title>
    <style>
        body {
            margin: 0;
            padding: 48px 16px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: #f5f7fa;
            color: #111827;
        }
        .container {
            max-width: 720px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 12px;
            padding: 24px 24px 20px;
            border: 1px solid #e5e7eb;
        }
        h1 {
            font-size: 24px;
            margin: 0 0 12px;
        }
        p {
            margin: 0 0 16px;
            color: #4b5563;
        }
        ul {
            margin: 0;
            padding: 0;
            list-style: none;
        }
        li + li {
            margin-top: 8px;
        }
        a {
            color: #165DFF;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>开源项目致谢</h1>
        <p>Hira 浏览器基于以下开源项目构建：</p>
        <ul>
            <li><a href="https://github.com/minbrowser/min" target="_blank">Min</a></li>
            <li><a href="https://github.com/wexond/browser-base" target="_blank">Wexond</a></li>
            <li><a href="https://github.com/electron/electron" target="_blank">Electron</a></li>
        </ul>
    </div>
</body>
</html>
