<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>STAR Talk NeXus | 在线聊天室</title>
    <style>
        /* 全局变量 - 浅色主题（默认） */
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f5;
            --bg-tertiary: #f0f0f0;
            --bg-hover: #e8e8e8;
            --bg-active: #e0e0e0;
            --text-primary: #111111;
            --text-secondary: #666666;
            --text-muted: #999999;
            --border: #e0e0e0;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #dbeafe;
            --success: #10b981;
            --danger: #ef4444;
            --shadow: 0 1px 3px rgba(0, 0, 0.1);
            --shadow-lg: 0 4px 12px rgba(0, 0, 0.15);
            --radius: 8px;
            --radius-lg: 12px;
            --transition: all 0.2s ease;
        }

        /* 深色主题 */
        [data-theme="dark"] {
            --bg-primary: #1e1e1e;
            --bg-secondary: #2d2d2d;
            --bg-tertiary: #383838;
            --bg-hover: #404040;
            --bg-active: #4a4a4a;
            --text-primary: #ffffff;
            --text-secondary: #b3b3b3;
            --text-muted: #808080;
            --border: #404040;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --primary-light: #1e3a8a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            padding-top: env(safe-area-inset-top, 0px);
        }

        .btn {
            border: none;
            border-radius: var(--radius);
            padding: 10px 16px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }
        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover {
            background-color: var(--bg-hover);
        }

        .input {
            background-color: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 16px;
            color: var(--text-primary);
            font-size: 15px;
            outline: none;
            transition: var(--transition);
        }
        .input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
        }
        .input::placeholder {
            color: var(--text-muted);
        }

        /* 主题切换按钮 - 桌面端右上角 */
        .theme-toggle {
            position: fixed;
            top: calc(16px + env(safe-area-inset-top, 0px));
            right: 16px;
            z-index: 10000;
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-size: 18px;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }
        .theme-toggle:hover {
            background-color: var(--bg-hover);
        }
        .theme-toggle:active {
            transform: scale(0.92);
        }

        /* 登录/注册弹窗 */
        .auth-mask {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: env(safe-area-inset-top, 0px);
        }
        .auth-box {
            background-color: var(--bg-primary);
            border-radius: var(--radius-lg);
            width: 360px;
            padding: 32px 24px;
            box-shadow: var(--shadow-lg);
            text-align: center;
        }
        .auth-box h3 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .auth-box .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 24px;
        }
        .auth-input {
            width: 100%;
            height: 48px;
            margin-bottom: 16px;
            font-size: 16px;
        }
        .auth-btn {
            width: 100%;
            height: 48px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }
        .auth-btn:hover {
            background-color: var(--primary-hover);
        }
        .auth-tip {
            font-size: 13px;
            color: var(--danger);
            height: 18px;
            margin-bottom: 8px;
        }
        .switch-text {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 16px;
            cursor: pointer;
        }
        .switch-text span {
            color: var(--primary);
            font-weight: 500;
        }

        /* 聊天室选择弹窗 */
        .room-select-mask {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: env(safe-area-inset-top, 0px);
        }
        .room-select-box {
            background-color: var(--bg-primary);
            border-radius: var(--radius-lg);
            width: 360px;
            padding: 32px 24px;
            box-shadow: var(--shadow-lg);
            text-align: center;
        }
        .room-select-box h3 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .room-select-box .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 24px;
        }
        .room-btn {
            width: 100%;
            height: 48px;
            margin-bottom: 12px;
            border: none;
            border-radius: var(--radius);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .public-btn {
            background-color: var(--primary);
            color: white;
        }
        .public-btn:hover {
            background-color: var(--primary-hover);
        }
        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: var(--text-muted);
            font-size: 13px;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background-color: var(--border);
        }
        .divider span {
            padding: 0 16px;
        }
        .private-input {
            width: 100%;
            height: 44px;
            margin-bottom: 12px;
        }
        .private-btn {
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }
        .private-btn:hover {
            background-color: var(--bg-hover);
        }
        .tip-text {
            font-size: 13px;
            color: var(--danger);
            height: 18px;
            margin-bottom: 8px;
        }

        /* 聊天主容器 */
        .chat-wrap {
            display: flex;
            width: 100%;
            height: 100%;
            max-width: 1400px;
            margin: 0 auto;
            background-color: var(--bg-primary);
            display: none;
        }

        /* 左侧房间列表 */
        .room-sidebar {
            width: 260px;
            background-color: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            height: 100%;
        }
        .room-sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .room-sidebar-header h2 {
            font-size: 18px;
            font-weight: 600;
        }
        .room-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        .room-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-radius: var(--radius);
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 4px;
        }
        .room-item:hover {
            background-color: var(--bg-hover);
        }
        .room-item.active {
            background-color: var(--primary-light);
            color: var(--primary);
        }
        .room-item.private .room-avatar {
            background-color: #7c3aed;
        }
        .room-avatar {
            width: 40px;
            height: 40px;
            border-radius: var(--radius);
            background-color: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 600;
            margin-right: 12px;
            flex-shrink: 0;
        }
        .room-info {
            flex: 1;
            overflow: hidden;
        }
        .room-name {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .room-desc {
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 中间聊天区 */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            border-right: 1px solid var(--border);
        }
        .chat-top {
            height: 56px;
            padding: 0 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background-color: var(--bg-primary);
        }
        .toggle-left-btn {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            border: none;
            background-color: transparent;
            color: var(--text-primary);
            border-radius: var(--radius);
            font-size: 18px;
            cursor: pointer;
            transition: var(--transition);
            display: none;
            -webkit-tap-highlight-color: transparent;
            z-index: 2;
        }
        .toggle-left-btn:hover {
            background-color: var(--bg-hover);
        }
        .toggle-right-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            border: none;
            background-color: transparent;
            color: var(--text-primary);
            border-radius: var(--radius);
            font-size: 18px;
            cursor: pointer;
            transition: var(--transition);
            display: none;
            -webkit-tap-highlight-color: transparent;
            z-index: 2;
        }
        .toggle-right-btn:hover {
            background-color: var(--bg-hover);
        }
        .room-title {
            font-size: 17px;
            font-weight: 600;
        }
        .current-username {
            font-size: 12px;
            color: var(--text-secondary);
            margin-left: 8px;
            background-color: var(--bg-tertiary);
            padding: 2px 10px;
            border-radius: 12px;
        }
        .conn-status {
            font-size: 12px;
            color: var(--text-secondary);
            margin-left: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .conn-status::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--danger);
        }
        .conn-status.connected::before {
            background-color: var(--success);
        }

        .chat-content {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            background-color: var(--bg-primary);
            -webkit-overflow-scrolling: touch;
        }

        /* 消息气泡 */
        .msg-row {
            margin-bottom: 16px;
            display: flex;
            width: 100%;
        }
        .msg-row.me {
            flex-direction: row-reverse;
        }
        .msg-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 600;
            flex-shrink: 0;
            align-self: flex-start;
        }
        .msg-row.me .msg-avatar {
            background-color: #7c3aed;
        }
        .msg-box {
            max-width: 65%;
            margin: 0 10px;
            display: flex;
            flex-direction: column;
        }
        .msg-row.me .msg-box {
            align-items: flex-end;
        }
        .msg-name {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
            font-weight: 500;
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .msg-bubble {
            padding: 10px 14px;
            border-radius: var(--radius-lg);
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
            overflow-wrap: break-word;
            word-break: break-word;
            white-space: pre-wrap;
            max-width: 100%;
            box-sizing: border-box;
        }
        .msg-row:not(.me) .msg-bubble {
            background-color: var(--bg-secondary);
            border-bottom-left-radius: 4px;
        }
        .msg-row.me .msg-bubble {
            background-color: var(--primary);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .msg-time {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
            text-align: right;
            align-self: flex-end;
        }
        .msg-row.me .msg-time {
            color: rgba(255, 255, 255, 0.7);
        }
        .system-tip {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin: 16px 0;
        }

        /* 底部输入区 */
        .chat-input {
            border-top: 1px solid var(--border);
            padding: 12px 20px;
            background-color: var(--bg-primary);
        }
        .input-bar {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #message-input {
            flex: 1;
            height: 40px;
        }
        #send-button {
            width: 70px;
            height: 40px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            flex-shrink: 0;
        }
        #send-button:hover:not(:disabled) {
            background-color: var(--primary-hover);
        }
        #send-button:disabled {
            background-color: var(--bg-tertiary);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        /* 右侧在线用户 */
        .online-sidebar {
            width: 220px;
            background-color: var(--bg-secondary);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            height: 100%;
        }
        .online-sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .online-sidebar-header h3 {
            font-size: 15px;
            font-weight: 600;
        }
        .online-count {
            font-size: 12px;
            color: var(--text-secondary);
            background-color: var(--bg-tertiary);
            padding: 3px 8px;
            border-radius: 12px;
        }
        .online-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        .online-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            border-radius: var(--radius);
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 4px;
        }
        .online-item:hover {
            background-color: var(--bg-hover);
        }
        .online-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--success);
            margin-right: 10px;
            flex-shrink: 0;
        }
        .online-username {
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .mobile-mask {
            display: none;
            position: fixed;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            z-index: 98;
        }
        .mobile-mask.show {
            display: block;
        }

        /* Material Design 过渡动画 */
        .transition-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-secondary);
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .transition-overlay.show {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }
        .transition-overlay.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        .transition-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary) 0%, #60a5fa 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .transition-overlay.show .transition-circle {
            transform: scale(25);
        }
        .transition-overlay.fade-out .transition-circle {
            transform: scale(35);
        }

        .transition-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease 0.3s;
            color: white;
            text-align: center;
            transform: scale(0.8);
        }
        .transition-overlay.show .transition-content {
            opacity: 1;
            transform: scale(1);
        }
        .transition-overlay.fade-out .transition-content {
            opacity: 0;
            transform: scale(0.9);
        }

        .transition-icon {
            font-size: 24px;
            margin-bottom: 8px;
            animation: bounce 0.6s ease;
        }

        .transition-text {
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.5px;
            white-space: nowrap;
            padding: 0 20px;
        }

        @keyframes bounce {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* ========== 移动端样式 ========== */
        @media (max-width: 768px) {
            .chat-wrap {
                max-width: 100%;
            }

            .room-sidebar {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                width: 260px;
                transform: translateX(-100%);
                transition: transform 0.2s ease;
                z-index: 99;
                padding-top: env(safe-area-inset-top, 0px);
                border-right: none;
                background-color: var(--bg-primary);
            }
            .room-sidebar.show {
                transform: translateX(0);
            }

            .online-sidebar {
                position: fixed;
                right: 0;
                top: 0;
                bottom: 0;
                width: 220px;
                transform: translateX(100%);
                transition: transform 0.2s ease;
                z-index: 99;
                padding-top: env(safe-area-inset-top, 0px);
                background-color: var(--bg-primary);
            }
            .online-sidebar.show {
                transform: translateX(0);
            }

            .toggle-left-btn,
            .toggle-right-btn {
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .chat-main {
                border-right: none;
            }

            .msg-box {
                max-width: 80%;
            }

            .room-select-box,
            .auth-box {
                width: 90%;
                padding: 28px 20px;
            }

            /* 移动端主题按钮固定到左下角，避免遮挡右上角的在线列表按钮 */
            .theme-toggle {
                top: auto;
                right: auto;
                bottom: calc(80px + env(safe-area-inset-bottom, 0px));
                left: 16px;
                width: 38px;
                height: 38px;
                font-size: 16px;
                box-shadow: 0 2px 8px rgba(0, 0, 0.2);
                z-index: 10000;
            }

            #message-input {
                font-size: 14px;
                padding: 12px 12px;
            }
            #send-button {
                width: 60px;
                font-size: 13px;
            }
            .input-bar {
                gap: 6px;
            }
            .chat-input {
                padding: 10px 12px;
            }
            .chat-top {
                padding: 0 12px;
            }
            .room-title {
                font-size: 15px;
            }
        }

        @media (max-width: 400px) {
            #message-input {
                font-size: 13px;
                padding: 12px 8px;
            }
            #send-button {
                width: 52px;
                font-size: 12px;
            }
            .input-bar {
                gap: 4px;
            }
            .chat-input {
                padding: 8px 8px;
            }
            .theme-toggle {
                bottom: calc(72px + env(safe-area-inset-bottom, 0px));
                left: 10px;
                width: 34px;
                height: 34px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" aria-label="切换深色/浅色主题">🌙</button>

    <!-- 登录/注册弹窗 -->
    <div class="auth-mask" id="authMask">
        <div class="auth-box">
            <h3>🌟 STAR Talk NeXus</h3>
            <p class="subtitle" id="authSubtitle">账号登录</p>
            <div class="auth-tip" id="authTip"></div>
            <input type="text" class="input auth-input" id="authUsername" placeholder="用户名" maxlength="20" autocomplete="username">
            <input type="password" class="input auth-input" id="authPassword" placeholder="密码" autocomplete="current-password">
            <button class="auth-btn" id="authBtn">登录</button>
            <p class="switch-text">没有账号？<span id="switchMode">立即注册</span></p>
        </div>
    </div>

    <div class="room-select-mask" id="roomSelectMask" style="display: none;">
        <div class="room-select-box">
            <h3>STAR Talk NeXus</h3>
            <p class="subtitle">选择聊天室开始聊天</p>
            <button class="room-btn public-btn" id="publicBtn">
                <span>🌐</span> 公共聊天室
            </button>
            <div class="divider"><span>私密聊天</span></div>
            <div class="tip-text" id="pwdTip"></div>
            <input type="password" class="input private-input" id="pwdInput" placeholder="输入密码">
            <button class="room-btn private-btn" id="privateBtn">
                <span>🔒</span> 进入私密聊天室
            </button>
        </div>
    </div>

    <div class="mobile-mask" id="mobileMask"></div>

    <!-- Material Design 风格过渡动画 -->
    <div class="transition-overlay" id="transitionOverlay">
        <div class="transition-circle">
            <div class="transition-content">
                <div class="transition-icon">💬</div>
                <div class="transition-text" id="transitionText">你正在公共聊天室聊天</div>
            </div>
        </div>
    </div>

    <div class="chat-wrap" id="chatWrap">
        <div class="room-sidebar" id="roomSidebar">
            <div class="room-sidebar-header"><h2>聊天室</h2></div>
            <div class="room-list" id="roomList">
                <div class="room-item active" data-room="public">
                    <div class="room-avatar">公</div>
                    <div class="room-info">
                        <div class="room-name">公共聊天室</div>
                        <div class="room-desc">自由交流</div>
                    </div>
                </div>
                <!-- 仅代码控制显示，默认先保留，JS 登录后判断权限 -->
                <div class="room-item private" data-room="private-260120" id="secretRoomItem">
                    <div class="room-avatar">私</div>
                    <div class="room-info">
                        <div class="room-name">🤫</div>
                        <div class="room-desc">密码保护</div>
                    </div>
                </div>
				<div class="room-item private" data-room="private-test-group">
                    <div class="room-avatar">宫</div>
                    <div class="room-info">
                        <div class="room-name">STAR Talk 测试组后宫</div>
                        <div class="room-desc">密码保护</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="chat-main">
            <div class="chat-top">
                <button class="toggle-left-btn" id="toggleLeftBtn" aria-label="打开聊天室列表">☰</button>
                <div>
                    <span class="room-title" id="currentRoomName">公共聊天室</span>
                    <span class="current-username" id="currentUsernameDisplay"></span>
                    <span class="conn-status" id="connectionStatus">正在连接...</span>
                </div>
                <button class="toggle-right-btn" id="toggleRightBtn" aria-label="打开在线用户列表">👥</button>
            </div>
            <div class="chat-content" id="messagesContainer">
                <div class="system-tip">欢迎来到聊天室</div>
            </div>
            <div class="chat-input">
                <div class="input-bar">
                    <input type="text" class="input" id="message-input" placeholder="输入消息...">
                    <button id="send-button" disabled>发送</button>
                </div>
            </div>
        </div>

        <div class="online-sidebar" id="onlineSidebar">
            <div class="online-sidebar-header">
                <h3>在线用户</h3>
                <span class="online-count" id="onlineCount">0</span>
            </div>
            <div class="online-list" id="onlineUsers"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script>
        // 加密函数（SHA-256）
        async function sha256(str) {
            const encoder = new TextEncoder();
            const data = encoder.encode(str);
            const hash = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(hash))
                .map(b => b.toString(16).padStart(2, '0'))
                .join('');
        }

        // 有权限查看 🤫 房间的用户白名单
        const ALLOW_USER_LIST = ['ALEX1NG', 'YUK1NG'];

        const ROOMS = {
            'public': { name: '公共聊天室', needPassword: false, icon: '公', desc: '自由交流' },
            'private-260120': { name: '🤫', needPassword: true, password: '260120', icon: '私', desc: '密码保护' },
			'private-test-group': { name: 'STAR Talk 测试组后宫', needPassword: true, password: 'FVVEVANS', icon: '宫', desc: '密码保护' }
        };
        const DEFAULT_ROOM = 'public';
        const KNOWN_ROOM_IDS = Object.keys(ROOMS);

        const firebaseConfig = {
            apiKey: "AIzaSyD8t9QqsluQRx37krfzPdRvZYHU2xClt18",
            authDomain: "star-higheritech-star-talk.firebaseapp.com",
            databaseURL: "https://star-higheritech-star-talk-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "star-higheritech-star-talk",
            storageBucket: "star-higheritech-star-talk.firebasestorage.app",
            messagingSenderId: "610218110599",
            appId: "1:610218110599:web:a86650f9662cff7e441222"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const connectedRef = database.ref('.info/connected');
        const usersRef = database.ref('users');

        // 全局状态
        let isLoginMode = true;
        let currentUser = null;

        // DOM元素
        const themeToggle = document.getElementById('themeToggle');
        const authMask = document.getElementById('authMask');
        const authSubtitle = document.getElementById('authSubtitle');
        const authTip = document.getElementById('authTip');
        const authUsername = document.getElementById('authUsername');
        const authPassword = document.getElementById('authPassword');
        const authBtn = document.getElementById('authBtn');
        const switchMode = document.getElementById('switchMode');
        const roomSelectMask = document.getElementById('roomSelectMask');
        const publicBtn = document.getElementById('publicBtn');
        const privateBtn = document.getElementById('privateBtn');
        const pwdInput = document.getElementById('pwdInput');
        const pwdTip = document.getElementById('pwdTip');
        const chatWrap = document.getElementById('chatWrap');
        const mobileMask = document.getElementById('mobileMask');
        const roomSidebar = document.getElementById('roomSidebar');
        const roomItems = document.querySelectorAll('.room-item');
        const toggleLeftBtn = document.getElementById('toggleLeftBtn');
        const toggleRightBtn = document.getElementById('toggleRightBtn');
        const messagesContainer = document.getElementById('messagesContainer');
        const messageInput = document.getElementById('message-input');
        const sendButton = document.getElementById('send-button');
        const connectionStatus = document.getElementById('connectionStatus');
        const currentRoomName = document.getElementById('currentRoomName');
        const currentUsernameDisplay = document.getElementById('currentUsernameDisplay');
        const onlineSidebar = document.getElementById('onlineSidebar');
        const onlineUsersContainer = document.getElementById('onlineUsers');
        const onlineCount = document.getElementById('onlineCount');
        const secretRoomItem = document.getElementById('secretRoomItem');
        const transitionOverlay = document.getElementById('transitionOverlay');
        const transitionText = document.getElementById('transitionText');

        let isConnected = false;
        let currentRoom = null;
        let currentUserRef = null;
        let targetRoomId = null;
        let messagesCallback = null;
        let onlineUsersCallback = null;

        // 根据登录用户名控制 私密🤫房间 显示/隐藏
        function checkSecretRoomPermission(username) {
            if (ALLOW_USER_LIST.includes(username)) {
                secretRoomItem.style.display = 'flex';
            } else {
                secretRoomItem.style.display = 'none';
                // 如果当前正好在该私密房，强制切回公共房
                if (currentRoom === 'private-260120') {
                    enterRoom(DEFAULT_ROOM);
                }
            }
        }

        // 主题初始化
        function initTheme() {
            const saved = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', saved);
            themeToggle.textContent = saved === 'light' ? '🌙' : '☀️';
        }
        function toggleTheme() {
            const cur = document.documentElement.getAttribute('data-theme');
            const next = cur === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            themeToggle.textContent = next === 'light' ? '🌙' : '☀️';
        }
        themeToggle.addEventListener('click', toggleTheme);

        // 存储工具
        function getSavedRoom() {
            const saved = localStorage.getItem('lastRoom');
            return saved && KNOWN_ROOM_IDS.includes(saved) ? saved : DEFAULT_ROOM;
        }
        function saveRoom(id) { localStorage.setItem('lastRoom', id); }
        function isPrivateRoomVerified(roomId) { return localStorage.getItem('privateRoomVerified_' + roomId) === 'true'; }
        function setPrivateRoomVerified(roomId, v) { localStorage.setItem('privateRoomVerified_' + roomId, v ? 'true' : 'false'); }
        
        // 用户登录状态
        function saveUserSession(user) {
            currentUser = user;
            localStorage.setItem('chatUser', JSON.stringify(user));
            updateUsernameDisplay();
            // 登录后立即校验房间权限
            checkSecretRoomPermission(user.username);
        }
        function loadUserSession() {
            const user = localStorage.getItem('chatUser');
            if(user) {
                currentUser = JSON.parse(user);
                // 读取本地用户后校验权限
                checkSecretRoomPermission(currentUser.username);
                return true;
            }
            return false;
        }
        function updateUsernameDisplay() {
            const name = currentUser?.username || '';
            currentUsernameDisplay.textContent = name ? `👤 ${name}` : '';
        }

        // 切换登录/注册模式
        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            if(isLoginMode) {
                authSubtitle.textContent = '账号登录';
                authBtn.textContent = '登录';
                switchMode.textContent = '立即注册';
            } else {
                authSubtitle.textContent = '账号注册';
                authBtn.textContent = '注册';
                switchMode.textContent = '返回登录';
            }
            authTip.textContent = '';
        }
        switchMode.addEventListener('click', toggleAuthMode);

        // 验证输入
        function validateAuthInput() {
            const username = authUsername.value.trim();
            const password = authPassword.value.trim();
            
            if(!username) {
                authTip.textContent = '用户名不能为空';
                return null;
            }
            if(username.length > 20) {
                authTip.textContent = '用户名不能超过20字符';
                return null;
            }
            if(!password) {
                authTip.textContent = '密码不能为空';
                return null;
            }
            if(password.length < 6) {
                authTip.textContent = '密码至少6位';
                return null;
            }
            
            return { username, password };
        }

        // 注册处理
        async function handleRegister() {
            const data = validateAuthInput();
            if(!data) return;
            
            try {
                // 检查用户名是否已存在
                const snapshot = await usersRef.child(data.username).once('value');
                if(snapshot.exists()) {
                    authTip.textContent = '用户名已被注册';
                    return;
                }
                
                // 密码加密
                const hashedPwd = await sha256(data.password);
                const userData = {
                    username: data.username,
                    password: hashedPwd,
                    createdAt: Date.now()
                };
                
                // 写入数据库
                await usersRef.child(data.username).set(userData);
                authTip.textContent = '';
                alert('注册成功！请登录');
                toggleAuthMode();
            } catch (err) {
                console.error(err);
                authTip.textContent = '注册失败，请重试';
            }
        }

        // 登录处理
        async function handleLogin() {
            const data = validateAuthInput();
            if(!data) return;
            
            try {
                const snapshot = await usersRef.child(data.username).once('value');
                if(!snapshot.exists()) {
                    authTip.textContent = '用户名不存在';
                    return;
                }
                
                const userData = snapshot.val();
                const hashedPwd = await sha256(data.password);
                
                if(userData.password !== hashedPwd) {
                    authTip.textContent = '密码错误';
                    return;
                }
                
                // 登录成功
                saveUserSession({ username: data.username });
                authMask.style.display = 'none';
                initializeChat();
            } catch (err) {
                console.error(err);
                authTip.textContent = '登录失败，请重试';
            }
        }

        // 认证按钮点击
        authBtn.addEventListener('click', () => {
            if(isLoginMode) handleLogin();
            else handleRegister();
        });
        // 回车提交
        authPassword.addEventListener('keypress', e => {
            if(e.key === 'Enter') authBtn.click();
        });

        // 聊天室功能
        function enterRoom(roomId) {
            // 显示过渡动画
            transitionText.textContent = '你正在' + ROOMS[roomId].name + '聊天';
            transitionOverlay.classList.remove('fade-out');
            transitionOverlay.classList.add('show');

            // 动画结束后进入房间
            setTimeout(() => {
                if (messagesCallback) {
                    database.ref('rooms/' + currentRoom + '/messages').off('child_added', messagesCallback);
                    messagesCallback = null;
                }
                if (onlineUsersCallback) {
                    database.ref('rooms/' + currentRoom + '/onlineUsers').off('value', onlineUsersCallback);
                    onlineUsersCallback = null;
                }
                if (currentUserRef) { currentUserRef.remove(); currentUserRef = null; }

                currentRoom = roomId;
                saveRoom(roomId);
                currentRoomName.textContent = ROOMS[roomId].name;
                roomItems.forEach(item => item.classList.toggle('active', item.dataset.room === roomId));
                messagesContainer.innerHTML = '<div class="system-tip">欢迎来到 ' + ROOMS[roomId].name + '</div>';

                const roomRef = database.ref('rooms/' + roomId);
                const messagesRef = roomRef.child('messages');
                const onlineUsersRef = roomRef.child('onlineUsers');

                messagesCallback = snapshot => {
                    const msg = snapshot.val();
                    if (msg && msg.timestamp) displayMessage(msg);
                };
                onlineUsersCallback = snapshot => updateOnlineUsers(snapshot);

                messagesRef.limitToLast(50).on('child_added', messagesCallback);
                onlineUsersRef.on('value', onlineUsersCallback);

                if (currentUser && isConnected) {
                    currentUserRef = onlineUsersRef.push({ 
                        userId: currentUser.username, 
                        username: currentUser.username 
                    });
                    currentUserRef.onDisconnect().remove();
                }

                if (window.innerWidth <= 768) {
                    roomSidebar.classList.remove('show');
                    onlineSidebar.classList.remove('show');
                    mobileMask.classList.remove('show');
                }

                // 隐藏过渡动画
                setTimeout(() => {
                    transitionOverlay.classList.add('fade-out');
                }, 100);
            }, 600);
        }

        function enterPrivateRoom() {
            const pwd = pwdInput.value.trim();
            if (!pwd) { pwdTip.innerText = "请输入密码"; return; }
            const target = targetRoomId || 'private-260120';
            if (pwd === ROOMS[target].password) {
                pwdTip.innerText = "";
                setPrivateRoomVerified(target, true);
                roomSelectMask.style.display = "none";
                chatWrap.style.display = "flex";
                enterRoom(target);
                targetRoomId = null;
            } else {
                pwdTip.innerText = "密码错误，请重新输入";
                pwdInput.value = "";
                pwdInput.focus();
            }
        }

        publicBtn.addEventListener('click', () => {
            roomSelectMask.style.display = "none";
            chatWrap.style.display = "flex";
            enterRoom('public');
        });
        privateBtn.addEventListener('click', enterPrivateRoom);
        pwdInput.addEventListener('keydown', e => { if (e.key === 'Enter') enterPrivateRoom(); });

        roomItems.forEach(item => {
            item.addEventListener('click', () => {
                const roomId = item.dataset.room;
                if (roomId === currentRoom) return;
                if (ROOMS[roomId].needPassword && !isPrivateRoomVerified(roomId)) {
                    targetRoomId = roomId;
                    roomSelectMask.style.display = "flex";
                    chatWrap.style.display = "none";
                    pwdInput.value = "";
                    pwdTip.innerText = "";
                    pwdInput.focus();
                } else {
                    enterRoom(roomId);
                }
            });
        });

        toggleLeftBtn.addEventListener('click', () => {
            const opening = !roomSidebar.classList.contains('show');
            roomSidebar.classList.toggle('show');
            onlineSidebar.classList.remove('show');
            mobileMask.classList.toggle('show', opening);
        });
        toggleRightBtn.addEventListener('click', () => {
            const opening = !onlineSidebar.classList.contains('show');
            onlineSidebar.classList.toggle('show');
            roomSidebar.classList.remove('show');
            mobileMask.classList.toggle('show', opening);
        });
        mobileMask.addEventListener('click', () => {
            roomSidebar.classList.remove('show');
            onlineSidebar.classList.remove('show');
            mobileMask.classList.remove('show');
        });

        function updateOnlineUsers(snapshot) {
            onlineUsersContainer.innerHTML = '';
            const users = snapshot.val() || {};
            const arr = Object.values(users);
            onlineCount.textContent = arr.length;
            arr.forEach(user => {
                const div = document.createElement('div');
                div.className = 'online-item';
                div.innerHTML = `<div class="online-dot"></div><div class="online-username">${escapeHTML(user.username)}</div>`;
                onlineUsersContainer.appendChild(div);
            });
        }
        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        connectedRef.on('value', snapshot => {
            isConnected = snapshot.val();
            if (isConnected) {
                connectionStatus.textContent = '已连接';
                connectionStatus.classList.add('connected');
                sendButton.disabled = false;
                
                if (currentRoom && currentUser) {
                    const ref = database.ref('rooms/' + currentRoom).child('onlineUsers');
                    currentUserRef = ref.push({ 
                        userId: currentUser.username, 
                        username: currentUser.username 
                    });
                    currentUserRef.onDisconnect().remove();
                }
            } else {
                connectionStatus.textContent = '连接中断';
                connectionStatus.classList.remove('connected');
                sendButton.disabled = true;
            }
        });

        function sendMessage() {
            if (!isConnected || !currentRoom || !currentUser) { 
                alert('请先登录'); 
                return; 
            }
            
            const text = messageInput.value.trim();
            if (!text) { alert('请输入消息内容'); return; }

            database.ref('rooms/' + currentRoom).child('messages').push({
                username: currentUser.username,
                text,
                timestamp: firebase.database.ServerValue.TIMESTAMP,
                userId: currentUser.username
            }).catch(err => { console.error(err); alert('发送失败'); });
            messageInput.value = '';
            messageInput.focus();
        }

        function displayMessage(msg) {
            const isMe = currentUser && msg.userId === currentUser.username;
            const time = new Date(msg.timestamp).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            const row = document.createElement('div');
            row.className = `msg-row ${isMe ? 'me' : ''}`;
            row.innerHTML = `
                <div class="msg-avatar">${escapeHTML(msg.username.charAt(0))}</div>
                <div class="msg-box">
                    <div class="msg-name">${escapeHTML(msg.username)}</div>
                    <div class="msg-bubble">${escapeHTML(msg.text)}</div>
                    <div class="msg-time">${time}</div>
                </div>
            `;
            messagesContainer.appendChild(row);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function initializeChat() {
            const saved = getSavedRoom();
            // 先校验权限，再进入房间
            if (saved === 'public') {
                roomSelectMask.style.display = "none";
                chatWrap.style.display = "flex";
                enterRoom('public');
            } else if (saved.startsWith('private-') && !isPrivateRoomVerified(saved)) {
                targetRoomId = saved;
                roomSelectMask.style.display = "flex";
                chatWrap.style.display = "none";
                pwdInput.value = "";
                pwdTip.innerText = "";
                pwdInput.focus();
            } else {
                // 非白名单用户禁止进入🤫房间
                if(saved === 'private-260120' && !ALLOW_USER_LIST.includes(currentUser?.username)){
                    enterRoom(DEFAULT_ROOM);
                    roomSelectMask.style.display = "none";
                    chatWrap.style.display = "flex";
                }else{
                    roomSelectMask.style.display = "none";
                    chatWrap.style.display = "flex";
                    enterRoom(saved);
                }
            }
        }

        // 页面加载
        window.addEventListener('load', () => {
            initTheme();
            if(loadUserSession()) {
                // 已登录
                authMask.style.display = 'none';
                updateUsernameDisplay();
                initializeChat();
            } else {
                // 未登录，显示登录界面
                authMask.style.display = 'flex';
                // 未登录时先隐藏私密房
                secretRoomItem.style.display = 'none';
            }
        });

        window.addEventListener('resize', () => {
            if (window.innerWidth > 768) {
                roomSidebar.classList.remove('show');
                onlineSidebar.classList.remove('show');
                mobileMask.classList.remove('show');
            }
        });
    </script>
</body>
</html>
