<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>100天 · 一封未拆的信</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #ff9a9e 0%, #fad0c4 50%, #fad0c4 100%);
            background-attachment: fixed;
            font-family: 'Segoe UI', 'Quicksand', system-ui, -apple-system, 'Helvetica Neue', 'Nunito', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            padding: 16px;
        }

        /* 漂浮装饰 */
        .floating-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .floating-bg i {
            position: absolute;
            display: block;
            list-style: none;
            opacity: 0.6;
            animation: floatAnim 12s linear infinite;
            font-style: normal;
        }

        @keyframes floatAnim {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.7; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; }
        }

        /* 密码验证遮罩层 */
        .password-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 235, 240, 0.92);
            backdrop-filter: blur(12px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s ease;
        }

        .password-card {
            background: rgba(255, 248, 245, 0.95);
            backdrop-filter: blur(8px);
            border-radius: 56px;
            width: 85%;
            max-width: 400px;
            padding: 2rem 1.8rem;
            text-align: center;
            box-shadow: 0 30px 45px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(255, 255, 255, 0.8);
            animation: fadeSlideUp 0.6s ease;
        }

        .password-card .heart-icon {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        .password-card h2 {
            font-size: 1.6rem;
            color: #b13b4d;
            margin-bottom: 0.5rem;
        }

        .password-card p {
            color: #a13e4f;
            margin-bottom: 1.2rem;
            font-size: 0.9rem;
        }

        .password-input {
            width: 100%;
            padding: 12px 16px;
            font-size: 1.2rem;
            text-align: center;
            border: 2px solid #ffb7c5;
            border-radius: 60px;
            background: #fff9f7;
            font-family: monospace;
            letter-spacing: 2px;
            outline: none;
            transition: 0.2s;
        }
        .password-input:focus {
            border-color: #ff6680;
            box-shadow: 0 0 0 3px rgba(255,102,128,0.2);
        }

        .password-btn {
            background: #ff98aa;
            border: none;
            padding: 10px 24px;
            border-radius: 60px;
            font-weight: bold;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1.2rem;
            transition: 0.2s;
            box-shadow: 0 5px 0 #b35d6e;
            font-family: inherit;
        }
        .password-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #b35d6e;
        }

        .error-msg {
            color: #d9534f;
            font-size: 0.8rem;
            margin-top: 0.8rem;
            min-height: 2rem;
        }

        /* 主内容容器（初始隐藏） */
        .main-content {
            display: none;
            width: 100%;
            max-width: 960px;
            margin: 0 auto;
        }

        /* 主卡片 - 宽度更大 */
        .card {
            position: relative;
            z-index: 10;
            background: rgba(255, 248, 245, 0.88);
            backdrop-filter: blur(14px);
            border-radius: 56px;
            width: 100%;
            max-width: 920px;
            margin: 0 auto;
            padding: 2.5rem 2rem 3rem;
            box-shadow: 0 30px 45px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(255, 255, 255, 0.8);
            text-align: center;
            animation: fadeSlideUp 0.8s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        @keyframes fadeSlideUp {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .heart-icon {
            font-size: 4rem;
            animation: heartbeat 1.4s infinite ease-in-out;
            display: inline-block;
            margin-bottom: 0.6rem;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); text-shadow: 0 0 8px #ff3366; }
        }

        .day-number {
            font-size: 4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ff3366, #ff6680);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: 6px;
            margin: 12px 0 5px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #b13b4d;
            letter-spacing: -0.3px;
            margin-bottom: 0.5rem;
        }

        .capsules {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.8rem;
            margin: 1.2rem 0 1rem;
        }
        .capsule {
            background: rgba(255, 220, 200, 0.85);
            backdrop-filter: blur(4px);
            padding: 0.4rem 1rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #ad4b62;
            letter-spacing: 0.5px;
            border: 0.5px solid rgba(255, 140, 120, 0.4);
            cursor: pointer;
        }

        .names {
            font-size: 1.4rem;
            font-weight: 600;
            background: linear-gradient(120deg, #f85762, #ff9a5f);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin: 0.8rem 0 0.6rem;
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .names span {
            background: rgba(255,255,240,0.7);
            padding: 0.2rem 1rem;
            border-radius: 40px;
            backdrop-filter: blur(2px);
        }

        .divider {
            width: 80px;
            height: 3px;
            background: #ffb7c5;
            margin: 0.8rem auto;
            border-radius: 5px;
        }

        .message {
            font-size: 1rem;
            color: #661c2c;
            background: rgba(255, 235, 225, 0.8);
            padding: 1.2rem;
            border-radius: 48px;
            margin: 1rem 0;
            line-height: 1.65;
            font-weight: 500;
        }

        .envelope-btn {
            background: #ff98aa;
            border: none;
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: bold;
            color: white;
            font-size: 1.1rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 5px 0 #b35d6e;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .envelope-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #b35d6e;
        }

        .gift-btn {
            background: #ffb347;
            border: none;
            padding: 10px 28px;
            border-radius: 60px;
            font-weight: bold;
            color: white;
            font-size: 1rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            font-family: inherit;
            display: none;
            margin-top: 1rem;
        }
        .gift-btn:hover {
            background: #ff9f2a;
            transform: scale(0.97);
        }

        /* 模态框 - 更宽更长，手机适配 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 235, 240, 0.65);
            backdrop-filter: blur(10px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: #fff9f7;
            width: 90vw;
            max-width: 820px;
            border-radius: 56px;
            padding: 1.5rem;
            text-align: center;
            animation: bounceIn 0.3s ease;
            position: relative;
            box-shadow: 0 30px 40px rgba(0, 0, 0, 0.15);
            border: 1px solid #ffe2e8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.7); opacity: 0; }
            80% { transform: scale(1.02); }
            100% { transform: scale(1); opacity: 1; }
        }

        .close-modal {
            position: absolute;
            top: 16px;
            right: 20px;
            font-size: 30px;
            cursor: pointer;
            color: #c96f80;
            transition: 0.2s;
            z-index: 10;
            background: rgba(255,240,235,0.6);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .close-modal:hover {
            color: #a13e4f;
            background: rgba(255,220,210,0.9);
        }

        .envelope-container {
            cursor: pointer;
            transition: transform 0.2s ease;
            max-width: 280px;
            margin: 0 auto;
            padding: 20px 0;
        }
        .envelope-container:hover {
            transform: scale(1.02);
        }
        .envelope-pic {
            font-size: 130px;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.15));
            animation: slightFloat 2s infinite ease-in-out;
        }
        .envelope-text {
            margin-top: 16px;
            font-size: 1.1rem;
            color: #b35d6e;
            background: rgba(255,220,210,0.8);
            display: inline-block;
            padding: 6px 20px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
        }

        @keyframes slightFloat {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
            100% { transform: translateY(0px); }
        }

        .letter-paper {
            display: none;
            background: #fffaf5;
            border-radius: 40px;
            padding: 1.8rem;
            text-align: left;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            border: 1px solid #ffe0cc;
            width: 100%;
            max-height: 75vh;
            overflow-y: auto;
            font-family: 'Segoe UI', 'Courier New', monospace;
            animation: paperFade 0.5s ease-out;
        }

        @keyframes paperFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .letter-content {
            font-size: 1rem;
            line-height: 1.7;
            color: #4a2a2a;
            white-space: pre-wrap;
            font-weight: 500;
        }

        .modal-close-btn {
            background: #ffd1dc;
            padding: 8px 24px;
            border-radius: 60px;
            border: none;
            font-size: 0.9rem;
            font-weight: 600;
            color: #a13e4f;
            box-shadow: 0 4px 0 #b35d6e;
            cursor: pointer;
            margin-top: 28px;
            transition: 0.07s linear;
            font-family: inherit;
            display: inline-block;
        }
        .modal-close-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #b35d6e;
        }

        footer {
            font-size: 0.7rem;
            margin-top: 1rem;
            color: #c27d8c;
            opacity: 0.8;
        }

        /* 烟花粒子 */
        .firework-particle {
            position: fixed;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            animation: explodeParticle 0.8s ease-out forwards;
        }
        @keyframes explodeParticle {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }

        /* 手机端专用优化 */
        @media (max-width: 760px) {
            body { padding: 12px; }
            .card { padding: 1.5rem 1.2rem 2rem; max-width: 100%; }
            .heart-icon { font-size: 3rem; }
            .day-number { font-size: 3rem; letter-spacing: 3px; }
            h1 { font-size: 1.6rem; }
            .names { font-size: 1.1rem; gap: 0.4rem; }
            .message { font-size: 0.88rem; padding: 0.9rem; }
            .envelope-btn { padding: 8px 20px; font-size: 0.9rem; }
            .envelope-pic { font-size: 95px; }
            .modal-content { width: 95vw; padding: 1rem; }
            .letter-paper { padding: 1rem; max-height: 70vh; }
            .letter-content { font-size: 0.9rem; }
            .capsule { font-size: 0.75rem; padding: 0.25rem 0.8rem; }
        }
    </style>
</head>
<body>

<div class="floating-bg" id="floatBg"></div>

<!-- 密码验证界面 -->
<div id="passwordOverlay" class="password-overlay">
    <div class="password-card">
        <div class="heart-icon">🔐💗</div>
        <h2>专属密钥</h2>
        <p>请输入8位数字密码，是我的生日哦宝宝~</p>
        <input type="password" id="passwordInput" class="password-input" placeholder="********" maxlength="8" inputmode="numeric">
        <button id="submitPassword" class="password-btn">✨ 开启 ✨</button>
        <div id="errorMsg" class="error-msg"></div>
    </div>
</div>

<!-- 主内容 -->
<div id="mainContent" class="main-content">
    <div class="card">
        <div class="heart-icon">❤️‍🔥</div>
        <div class="day-number">100</div>
        <h1>Days of Us</h1>
        <div class="capsules">
            <span class="capsule">🍬 专属小笨蛋</span>
            <span class="capsule">💕 双向奔赴</span>
            <span class="capsule">✨ 100次日落</span>
            <span class="capsule">🎀 永远偏爱</span>
            <span class="capsule">🌸 每天心动</span>
        </div>
        <div class="names">
            <span>✨ PJH ✨</span>
            <span>💗  &  💗</span>
            <span>✨ LCY ✨</span>
        </div>
        <div class="divider"></div>
        <div class="message">
            🌙 一百天，你让我的世界变得又轻又甜。<br>
            你笑的时候，我的心脏会悄悄踮起脚尖；你靠过来，我就觉得一整天的云都变软了。<br>
            你愿意把心事放在我手心的样子，像把星星一颗颗藏进我怀里。<br>
            你每多笑一次，我就多收集一束光。<br>
            🥰 以后每一天，我还要这样哄着你，看你永远是只属于我的宝宝。
        </div>

        <button class="envelope-btn" id="openEnvelopeBtn">✉️ 有一封未拆的信 ✉️</button>
        <button class="gift-btn" id="giftBtn">🎁 拆开礼物 🎁</button>

        <div style="margin-top: 0.8rem;">
            <span style="font-size: 0.8rem; background: #fff0f0; padding: 4px 16px; border-radius: 50px;">🎀 戳一下信封，慢慢读信吧 🎀</span>
        </div>
        <footer>❤️ 只属于我们的小宇宙 · 100天快乐 ❤️</footer>
    </div>
</div>

<!-- 信纸模态框 -->
<div id="letterModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" id="closeModalBtn">&times;</span>
        <div id="envelopeView" class="envelope-container">
            <div class="envelope-pic">💌</div>
            <div class="envelope-text">点击拆开信封</div>
        </div>
        <div id="letterView" class="letter-paper">
            <div id="typewriterText" class="letter-content"></div>
            <button class="modal-close-btn" id="modalCloseBtn">收好信 ✨</button>
        </div>
    </div>
</div>

<script>
    // 漂浮背景 (小爱心)
    const bgContainer = document.getElementById('floatBg');
    const symbols = ['❤️', '🧡', '💛', '💚', '💙', '💜', '🩷', '🤍', '⭐', '🌟', '✨', '🌸', '💋', '🔥', '💗'];
    for (let i = 0; i < 85; i++) {
        let el = document.createElement('i');
        let size = Math.random() * 28 + 14;
        let left = Math.random() * 100;
        let duration = Math.random() * 15 + 8;
        let delay = Math.random() * 20;
        let symbol = symbols[Math.floor(Math.random() * symbols.length)];
        el.innerHTML = symbol;
        el.style.fontSize = size + 'px';
        el.style.left = left + '%';
        el.style.animationDuration = duration + 's';
        el.style.animationDelay = delay + 's';
        el.style.opacity = 0.55;
        bgContainer.appendChild(el);
    }

    // 情书内容（保留换行）
    const fullLetterText = `❤️‍🔥 写给我永远的唯一LCY ❤️‍🔥

一百天。不长，却足够你把呼吸落在我每一寸肌肤里。

还记得那个下午吗？车窗外光线一明一暗，你靠在我肩上睡着了，呼吸软软的，睫毛偶尔轻颤。我不敢动，怕惊醒你。那一刻我突然明白——这就是被人完全信任的感觉，又轻又满。

你总是这样，悄悄地、又理直气壮地靠近我。你会主动钻进我怀里，把脸埋在我颈窝，不说话，只是笑一笑，或者抿一下嘴唇。你摸我头发的时候指尖凉凉的，我会忍不住捏你脸，看你嘟起嘴又笑开。你咬我的时候轻轻的，像小猫磨牙，一点也不疼，只留下痒痒的甜。

还有很多只有我们知道的小瞬间：你的脚会悄悄踩在我脚上，或者轻轻夹住我的腿；亲过脸，手指交握时你故意收紧又松开。你把最柔软的一面全给了我，我也把所有的偏爱都堆在你身上。

你越来越喜欢黏着我，像一只找到窝的小猫，把自己整个人都挂在我身上。你正在变得越来越会撒娇，越来越敢把自己交给我。你所有的依赖和主动，我都觉得是星星落进怀里——一颗也不舍得弄丢。

以后的一百天，还有很多很多个。我会继续在你靠过来时张开手臂，在你咬我的时候笑着躲也不躲，在你睡着时帮你拢一拢碎发。你不用多想别的，你永远可以做我怀里那个可爱的小笨蛋。

我是你的。你也是我的。从第一天起就是这样，不用猜，也不用问。

—— 永远只爱你、永远只属于你的 PJH  ❤️‍🔥 😘😘😘`;


    // DOM 元素
    const modal = document.getElementById('letterModal');
    const openBtn = document.getElementById('openEnvelopeBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const envelopeView = document.getElementById('envelopeView');
    const letterView = document.getElementById('letterView');
    const typewriterDiv = document.getElementById('typewriterText');
    const modalCloseBtn = document.getElementById('modalCloseBtn');
    const giftBtn = document.getElementById('giftBtn');

    let isOpened = false;
    let typewriterTimeout = null;
    let giftShown = false;

    // 打字机效果（支持换行）
    function startTypewriter() {
        if (typewriterTimeout) clearTimeout(typewriterTimeout);
        typewriterDiv.innerHTML = '';
        let index = 0;
        function addChar() {
            if (index < fullLetterText.length) {
                let ch = fullLetterText.charAt(index);
                if (ch === '\n') {
                    typewriterDiv.innerHTML += '<br>';
                } else {
                    typewriterDiv.innerHTML += ch;
                }
                index++;
                typewriterTimeout = setTimeout(addChar, 22);
            } else {
                typewriterTimeout = null;
            }
        }
        addChar();
    }

    function resetLetterState() {
        if (typewriterTimeout) clearTimeout(typewriterTimeout);
        typewriterDiv.innerHTML = '';
        envelopeView.style.display = 'block';
        letterView.style.display = 'none';
        isOpened = false;
    }

    function openEnvelope() {
        if (isOpened) return;
        isOpened = true;
        envelopeView.style.display = 'none';
        letterView.style.display = 'block';
        startTypewriter();
    }

    function closeModalFunc() {
        modal.style.display = 'none';
        resetLetterState();
        if (!giftShown) {
            giftBtn.style.display = 'inline-block';
            giftShown = true;
        }
    }

    function openModal() {
        resetLetterState();
        modal.style.display = 'flex';
    }

    function bindMainEvents() {
        if (openBtn) openBtn.addEventListener('click', (e) => { e.stopPropagation(); openModal(); });
        if (envelopeView) envelopeView.addEventListener('click', openEnvelope);
        if (closeModalBtn) closeModalBtn.addEventListener('click', closeModalFunc);
        if (modalCloseBtn) modalCloseBtn.addEventListener('click', closeModalFunc);
        window.addEventListener('click', (e) => { if (e.target === modal) closeModalFunc(); });
        if (giftBtn) {
            giftBtn.addEventListener('click', () => {
                alert('快上QQ给我发消息，说你看完信啦～有惊喜礼物等你哟！😘');
            });
        }
    }

    function startLightEffect() {
        const dayNum = document.querySelector('.day-number');
        if (dayNum) {
            setInterval(() => {
                dayNum.style.textShadow = '0 0 5px #ff99aa';
                setTimeout(() => dayNum.style.textShadow = 'none', 700);
            }, 1500);
        }
    }

    // 烟花特效（全屏点击，同时响应点击的任何位置）
    function createFireworkExplosion(x, y) {
        const colors = ['#ff3366', '#ff6680', '#ff99aa', '#ffc0cb', '#ffb347', '#ff85a1', '#ff4d6d', '#ff8da1', '#ffb76e'];
        const particleCount = 48;
        for (let i = 0; i < particleCount; i++) {
            let particle = document.createElement('div');
            particle.classList.add('firework-particle');
            let angle = Math.random() * Math.PI * 2;
            let speed = Math.random() * 140 + 50;
            let vx = Math.cos(angle) * speed;
            let vy = Math.sin(angle) * speed;
            let color = colors[Math.floor(Math.random() * colors.length)];
            particle.style.backgroundColor = color;
            particle.style.left = x + 'px';
            particle.style.top = y + 'px';
            particle.style.width = '10px';
            particle.style.height = '10px';
            document.body.appendChild(particle);
            
            let dx = 0, dy = 0;
            let opacity = 1;
            let frame = 0;
            function animate() {
                dx += vx * 0.016;
                dy += vy * 0.016;
                frame++;
                particle.style.transform = `translate(${dx}px, ${dy}px)`;
                opacity -= 0.022;
                particle.style.opacity = opacity;
                if (frame > 42 || opacity <= 0) {
                    particle.remove();
                } else {
                    requestAnimationFrame(animate);
                }
            }
            requestAnimationFrame(animate);
        }
    }

    function globalClickFirework(e) {
        let x = e.clientX;
        let y = e.clientY;
        if (x && y) {
            createFireworkExplosion(x, y);
        }
    }

    // 密码验证
    const passwordOverlay = document.getElementById('passwordOverlay');
    const mainContent = document.getElementById('mainContent');
    const passwordInput = document.getElementById('passwordInput');
    const submitBtn = document.getElementById('submitPassword');
    const errorMsgSpan = document.getElementById('errorMsg');
    const CORRECT_PWD = '20121027';

    function tryUnlock() {
        const entered = passwordInput.value.trim();
        if (entered === CORRECT_PWD) {
            passwordOverlay.style.display = 'none';
            mainContent.style.display = 'block';
            bindMainEvents();
            startLightEffect();
            // 绑定全局烟花
            document.body.addEventListener('click', globalClickFirework);
        } else {
            errorMsgSpan.innerText = '❌ 密码错误（提示：是我的生日8位数）';
            passwordInput.value = '';
            passwordInput.focus();
        }
    }

    submitBtn.addEventListener('click', tryUnlock);
    passwordInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') tryUnlock(); });

    // 额外大爱心漂浮
    for(let i=0;i<20;i++) {
        let bigLove = document.createElement('div');
        bigLove.innerHTML = '🌸💖🧸';
        bigLove.style.position = 'absolute';
        bigLove.style.fontSize = '30px';
        bigLove.style.bottom = '-50px';
        bigLove.style.left = Math.random() * 100 + '%';
        bigLove.style.opacity = '0.35';
        bigLove.style.animation = `floatAnim ${Math.random() * 14 + 10}s linear infinite`;
        bigLove.style.pointerEvents = 'none';
        document.querySelector('.floating-bg').appendChild(bigLove);
    }
</script>
</body>
</html>
